<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Aqlli Bolalar O’yinlari</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff4d6;
            --tx: #2b2b45;
            --card: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1d1b3a;
                --tx: #fff;
                --card: #2e2b57
            }
        }

        :root[data-theme="dark"] {
            --bg: #1d1b3a;
            --tx: #fff;
            --card: #2e2b57
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: 'Fredoka', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden
        }

        #app {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 2
        }

        .ttl {
            text-align: center;
            font-size: clamp(28px, 6vw, 48px);
            margin: 20px 0 4px
        }

        .sub {
            text-align: center;
            font-size: 20px;
            margin: 0 0 24px;
            opacity: .8
        }

        .grid {
            display: grid;
            gap: 16px
        }

        .g3 {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr))
        }

        .card {
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, .12);
            padding: 20px;
            text-align: center
        }

        .big,
        .gc {
            cursor: pointer;
            border: 5px solid var(--c);
            transition: transform .2s;
            animation: pop .5s backwards
        }

        .big:hover,
        .gc:hover {
            transform: translateY(-8px) rotate(-1.5deg) scale(1.03)
        }

        .big:active,
        .gc:active {
            transform: scale(.94)
        }

        .big .em {
            font-size: 76px;
            animation: bob 2s infinite
        }

        .big h2 {
            margin: 6px 0;
            font-size: 30px;
            color: var(--c)
        }

        .gc .em {
            font-size: 52px
        }

        .gc h3 {
            margin: 4px 0;
            color: var(--c)
        }

        .gc p {
            margin: 0;
            font-size: 15px;
            opacity: .8
        }

        .gc small {
            display: block;
            margin-top: 6px
        }

        .top {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .btn {
            font: inherit;
            font-weight: 700;
            font-size: 18px;
            border: 0;
            border-radius: 50px;
            padding: 10px 22px;
            background: #6c5ce7;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .25)
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none
        }

        .chip {
            background: var(--card);
            border-radius: 50px;
            padding: 8px 16px;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .12)
        }

        .timer {
            height: 26px;
            border-radius: 20px;
            background: rgba(0, 0, 0, .15);
            position: relative;
            overflow: hidden;
            margin-bottom: 16px
        }

        #bar {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width .1s linear, background .3s;
            border-radius: 20px
        }

        #bar.low {
            background: #e74c3c;
            animation: shake .3s infinite
        }

        #sec {
            position: absolute;
            inset: 0;
            text-align: center;
            font-weight: 700;
            line-height: 26px;
            color: #fff;
            text-shadow: 0 1px 2px #0006
        }

        .q {
            font-size: clamp(30px, 7vw, 56px);
            font-weight: 700;
            padding: 28px 12px;
            margin-bottom: 18px;
            animation: pop .4s;
            word-break: break-word
        }

        .opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .opt {
            font: inherit;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 700;
            color: #fff;
            border: 0;
            border-radius: 24px;
            padding: 20px 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .25);
            transition: transform .15s
        }

        .opt:hover:not(:disabled) {
            transform: scale(1.04)
        }

        .opt:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none
        }

        .o0 {
            background: #ff6b6b
        }

        .o1 {
            background: #4d96ff
        }

        .o2 {
            background: #f39c12
        }

        .o3 {
            background: #9b59b6
        }

        .opt:disabled {
            cursor: default;
            opacity: .55
        }

        .opt.right {
            background: #2ecc71 !important;
            opacity: 1;
            outline: 5px solid #fff
        }

        .opt.wrong {
            background: #555 !important;
            animation: shake .4s
        }

        .opt.jump {
            animation: jump .6s
        }

        #fb {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            min-height: 90px;
            margin-top: 14px;
            animation: pop .4s
        }

        #fb .st {
            font-size: 46px;
            letter-spacing: 4px
        }

        .res .em {
            font-size: 90px;
            animation: bob 1.5s infinite
        }

        .res h2 {
            font-size: 34px;
            margin: 8px
        }

        .res .big-st {
            font-size: 40px
        }

        .res p {
            font-size: 22px
        }

        #mute {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top, 0px));
            right: 10px;
            z-index: 9;
            font-size: 24px;
            border: 0;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            background: var(--card);
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .2)
        }

        .bgs span {
            position: fixed;
            font-size: 44px;
            opacity: .18;
            z-index: 1;
            animation: float 9s infinite ease-in-out;
            pointer-events: none
        }

        .fall {
            position: fixed;
            top: -40px;
            font-size: 32px;
            z-index: 20;
            pointer-events: none;
            animation: fall 2s linear forwards
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes bob {
            50% {
                transform: translateY(-10px) rotate(6deg)
            }
        }

        @keyframes shake {
            25% {
                transform: translateX(-8px)
            }

            75% {
                transform: translateX(8px)
            }
        }

        @keyframes jump {
            30% {
                transform: translateY(-22px) scale(1.1)
            }

            60% {
                transform: translateY(0) scale(.95)
            }
        }

        @keyframes float {
            50% {
                transform: translateY(-40px) rotate(20deg)
            }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(540deg)
            }
        }
    </style>
</head>

<body>
    <button id="mute" title="Ovoz">🔊</button>
    <div class="bgs"><span style="left:6%;top:15%">⭐</span><span
            style="left:85%;top:25%;animation-delay:1s">🎈</span><span
            style="left:12%;top:70%;animation-delay:2s">🔷</span><span
            style="left:80%;top:75%;animation-delay:3s">🌈</span><span
            style="left:45%;top:88%;animation-delay:4s">🧩</span></div>
    <div id="app"></div>
    <script>
        /* ---------- Ovozlar (Web Audio) ---------- */
        let AC, mute = false;
        function tone(f, d = .15, t = 'sine', v = .15, w = 0) { if (mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + w; o.type = t; o.frequency.value = f; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d); o.start(s); o.stop(s + d) } catch (e) { } }
        const snd = { click: () => tone(520, .08), ok: () => { tone(660, .12); tone(880, .2, 'sine', .15, .1) }, bad: () => tone(150, .35, 'sawtooth', .12), star: () => [1000, 1300, 1600].forEach((f, i) => tone(f, .1, 'triangle', .12, i * .08)), win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .15, i * .13)), time: () => { tone(300, .2, 'square', .1); tone(200, .3, 'square', .1, .2) } };
        document.getElementById('mute').onclick = function () { mute = !mute; this.textContent = mute ? '🔇' : '🔊'; snd.click() };

        /* ---------- Yordamchi funksiyalar ---------- */
        const app = document.getElementById('app');
        const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
        const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } };
        function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
        let R = Math.random; const ri = (a, b) => a + Math.floor(R() * (b - a + 1)), pick = a => a[ri(0, a.length - 1)];
        const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a };
        /* Raqamli savol: to'g'ri javob + 3 ta yaqin noto'g'ri javob */
        function num(q, a, sp = 5) { const s = new Set([a]); let n = 0; while (s.size < 4 && n++ < 80) { const v = a + ri(1, sp) * (R() < .5 ? -1 : 1); if (v >= 0 || a < 0) s.add(v) } return { q, a: String(a), o: [...s].map(String) } }
        function choose(q, a, o) { return { q, a, o } }
        const EM = { Mevalar: ['🍎', '🍌', '🍇', '🍓', '🍉', '🍊'], Hayvonlar: ['🐱', '🐶', '🐰', '🐻', '🦁', '🐸'], Transport: ['🚗', '🚌', '✈️', '🚀', '🚲', '🚂'], Sport: ['⚽', '🏀', '🎾', '🏐', '🏈', '🎱'] };

        /* ---------- O'yinlar katalogi (yangi o'yin qo'shish uchun shu yerga yozing) ---------- */
        const G = {
            '6': {
                name: '6–9 yosh', emoji: '🧸', color: '#ff5fa2', time: 20, games: [
                    { id: 'a1', n: 'Qo‘shish', e: '➕', d: 'Sonlarni qo‘shamiz!', g: () => { const a = ri(1, 30), b = ri(1, 20); return num(`${a} + ${b} = ?`, a + b, 4) } },
                    { id: 'a2', n: 'Ayirish', e: '➖', d: 'Sonlarni ayiramiz!', g: () => { const a = ri(5, 40), b = ri(1, a); return num(`${a} − ${b} = ?`, a - b, 4) } },
                    { id: 'a3', n: 'Ko‘paytirish jadvali', e: '✖️', d: 'Jadvalni yodla!', g: () => { const a = ri(2, 12), b = ri(2, 12); return num(`${a} × ${b} = ?`, a * b, 6) } },
                    { id: 'a4', n: 'Qaysi biri katta?', e: '⚖️', d: 'Sonlarni taqqosla', g: () => { const s = new Set(); while (s.size < 4) s.add(ri(1, 99)); const o = [...s], big = R() < .5; return choose(big ? 'Eng KATTA son qaysi?' : 'Eng KICHIK son qaysi?', String(big ? Math.max(...o) : Math.min(...o)), o.map(String)) } },
                    { id: 'a5', n: 'Ketma-ketlik', e: '🔢', d: 'Keyingi son nima?', g: () => { const s = ri(1, 20), d = ri(2, 9); return num(`${s}, ${s + d}, ${s + 2 * d}, ${s + 3 * d}, ?`, s + 4 * d, 4) } },
                    { id: 'a6', n: 'Nechta bor?', e: '🍎', d: 'Sanab ko‘r!', g: () => { const n = ri(1, 20), e = pick(Object.values(EM).flat()); return num(e.repeat(n), n, 3) } },
                    { id: 'a7', n: 'Ortiqchasini top', e: '🔍', d: 'Qaysi biri boshqacha?', g: () => { const k = Object.keys(EM), a = pick(k), b = pick(k.filter(x => x !== a)), same = shuf([...EM[a]]).slice(0, 3), odd = pick(EM[b]); return choose(same.join(' ') + ' ' + odd + ' — ortiqchasi qaysi?', odd, [...same, odd]) } }
                ]
            },
            '9': {
                name: '9–13 yosh', emoji: '🚀', color: '#18a0fb', time: 18, games: [
                    { id: 'b1', n: 'Katta ko‘paytirish', e: '✖️', d: 'Ikki xonali sonlar', g: () => { const a = ri(11, 99), b = ri(2, 9); return num(`${a} × ${b} = ?`, a * b, 10) } },
                    { id: 'b2', n: 'Bo‘lish', e: '➗', d: 'Qoldiqsiz bo‘l!', g: () => { const b = ri(2, 12), c = ri(2, 25); return num(`${b * c} ÷ ${b} = ?`, c, 4) } },
                    { id: 'b3', n: 'Tenglamalar', e: '🧮', d: 'X ni top!', g: () => { const x = ri(1, 30), a = ri(2, 12); return R() < .5 ? num(`x + ${a} = ${x + a}`, x, 4) : num(`${a}·x = ${a * x}`, x, 4) } },
                    { id: 'b4', n: 'Kasrlar', e: '🍕', d: 'Kasrlarni qo‘sh', g: () => { const d = ri(5, 12), a = ri(1, d - 2), b = ri(1, d - a - 1), s = a + b, ans = `${s}/${d}`, o = new Set([ans, `${s + 1}/${d}`, `${Math.max(1, s - 1)}/${d}`, `${s}/${2 * d}`, `${a * b}/${d}`]); return choose(`${a}/${d} + ${b}/${d} = ?`, ans, [...o].slice(0, 4).includes(ans) ? [...o].slice(0, 4) : [ans, ...[...o].slice(1, 4)]) } },
                    { id: 'b5', n: 'Kvadratlar', e: '🔲', d: 'Daraja va ildiz', g: () => { const n = ri(2, 25), k = ri(1, 9), t = ri(0, 2); return t == 0 ? num(`${n}² + ${k} = ?`, n * n + k, 8) : t == 1 ? num(`√${n * n} + ${k} = ?`, n + k, 3) : num(`${n}² − ${k} = ?`, n * n - k, 8) } },
                    { id: 'b6', n: 'Mantiqiy qator', e: '🧩', d: 'Qonuniyatni top', g: () => { const s = ri(1, 20), d = ri(1, 6); return R() < .6 ? num(`${s}, ${s + d}, ${s + 3 * d}, ${s + 6 * d}, ?`, s + 10 * d, 5) : (() => { const k = ri(2, 4), a = ri(1, 5); return num(`${a}, ${a * k}, ${a * k * k}, ${a * k ** 3}, ?`, a * k ** 4, Math.max(3, a * k)) })() } }
                ]
            },
            '13': {
                name: '13–17 yosh', emoji: '🎓', color: '#8e44ad', time: 15, games: [
                    { id: 'c1', n: 'Algebra', e: '🧮', d: 'ax + b = c', g: () => { const a = ri(2, 9), x = ri(-10, 15), b = ri(-9, 20); return num(`${a}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} = ${a * x + b}  →  x = ?`, x, 4) } },
                    { id: 'c2', n: 'Foizlar', e: '💯', d: 'Foizni hisobla', g: () => { const p = pick([5, 10, 15, 20, 25, 30, 40, 50, 60, 75]), n = ri(2, 40) * 20; return num(`${n} ning ${p}% i = ?`, p * n / 100, Math.max(3, p * n / 100 / 5 | 0)) } },
                    { id: 'c3', n: 'Darajalar', e: '⚡', d: 'Tezkor kvadratlar', g: () => { const a = ri(11, 30), b = ri(1, 30); return num(`${a}² − ${b} = ?`, a * a - b, 10) } },
                    { id: 'c4', n: 'Geometriya', e: '📐', d: 'Yuz va perimetr', g: () => { const a = ri(3, 25), b = ri(3, 25), t = ri(0, 2); return t == 0 ? num(`To‘g‘ri to‘rtburchak tomonlari ${a} va ${b}. Yuzi = ?`, a * b, 8) : t == 1 ? num(`To‘g‘ri to‘rtburchak tomonlari ${a} va ${b}. Perimetri = ?`, 2 * (a + b), 6) : num(`Uchburchak asosi ${2 * a}, balandligi ${b}. Yuzi = ?`, a * b, 8) } },
                    { id: 'c5', n: 'Mantiqiy qator', e: '🧩', d: 'Murakkab ketma-ketlik', g: () => { const t = ri(0, 2); if (t == 0) { const k = ri(2, 5), a = ri(1, 6); return num(`${a}, ${a * k}, ${a * k * k}, ${a * k ** 3}, ?`, a * k ** 4, a * k) } if (t == 1) { const n = ri(1, 9); return num(`${n * n}, ${(n + 1) ** 2}, ${(n + 2) ** 2}, ${(n + 3) ** 2}, ?`, (n + 4) ** 2, 8) } const s = ri(1, 15), d = ri(2, 8); return num(`${s}, ${s + d}, ${s + 3 * d}, ${s + 6 * d}, ${s + 10 * d}, ?`, s + 15 * d, 6) } },
                    { id: 'c6', n: 'Tezkor hisob', e: '⏱️', d: 'Ko‘paytir va ayir', g: () => { const a = ri(6, 19), b = ri(6, 19), c = ri(1, 50); return num(`${a} × ${b} − ${c} = ?`, a * b - c, 8) } },
                    { id: 'c7', n: 'O‘rtacha son', e: '📊', d: 'Sonlarning o‘rtachasi', g: () => { const m = ri(10, 60), o = [ri(-6, 6), ri(-6, 6), ri(-6, 6)]; o.push(-o.reduce((x, y) => x + y, 0)); return num(`${o.map(x => m + x).join(', ')} sonlarining o‘rtachasi = ?`, m, 4) } }
                ]
            }
        };

        /* ---------- Savollar bazasi: har bir o'yin uchun 100 ta noyob savol ---------- */
        function pool(g) {
            let h = 0; for (const c of g.id) h = h * 31 + c.charCodeAt(0); R = rng(h); const m = new Map(); let t = 0;
            while (m.size < 100 && t++ < 6000) { const x = g.g(); if (new Set(x.o).size < 2) continue; const k = x.q + '|' + [...x.o].sort(); if (!m.has(k)) m.set(k, x) }
            R = Math.random; return [...m.values()]
        }

        /* ---------- Ekranlar ---------- */
        let S = null; const stop = () => { if (S) clearInterval(S.iv) };
        function home() { stop(); app.innerHTML = `<h1 class="ttl">🧠 Aqlli Bolalar O‘yinlari</h1><p class="sub">Yoshingni tanla va o‘ynashni boshla!</p><div class="grid g3">${Object.entries(G).map(([k, c]) => `<div class="card big" style="--c:${c.color}" onclick="snd.click();list('${k}')"><div class="em">${c.emoji}</div><h2>${c.name}</h2><p>${c.games.length} ta o‘yin</p></div>`).join('')}</div>` }
        function list(k) { stop(); const c = G[k]; app.innerHTML = `<div class="top"><button class="btn" onclick="snd.click();home()">⬅ Orqaga</button></div><h1 class="ttl" style="color:${c.color}">${c.emoji} ${c.name}</h1><div class="grid g2">${c.games.map((g, i) => `<div class="card gc" style="--c:${c.color};animation-delay:${i * .07}s" onclick="snd.click();play('${k}',${i})"><div class="em">${g.e}</div><h3>${g.n}</h3><p>${g.d}</p><small>🏆 Rekord: ${load('best_' + g.id, 0)} ⭐</small></div>`).join('')}</div>` }
        function play(k, i) {
            stop(); const c = G[k], g = c.games[i], P = pool(g); let used = load('u_' + g.id, []); let av = P.map((_, j) => j).filter(j => !used.includes(j));
            if (av.length < 10) { used = []; av = P.map((_, j) => j) } shuf(av); const p = av.slice(0, 10); save('u_' + g.id, used.concat(p));
            S = { k, c, g, qs: p.map(j => P[j]), n: 0, stars: 0, ok: 0, lock: false }; ask()
        }
        function ask() {
            const q = S.qs[S.n], T = S.c.time * 1000; S.lock = false; S.t0 = performance.now();
            app.innerHTML = `<div class="top"><button class="btn" onclick="snd.click();list('${S.k}')">⬅ Orqaga</button><div class="chip">Savol ${S.n + 1}/10</div><div class="chip">⭐ ${S.stars}</div></div><div class="timer"><div id="bar"></div><span id="sec"></span></div><div class="card q">${q.q}</div><div class="opts">${shuf([...q.o]).map((x, j) => `<button class="opt o${j}" data-v="${x}">${x}</button>`).join('')}</div><div id="fb"></div>`;
            app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
            const bar = document.getElementById('bar'), sec = document.getElementById('sec'); clearInterval(S.iv);
            S.iv = setInterval(() => { const f = (performance.now() - S.t0) / T; if (f >= 1) { answer(null); return } bar.style.width = (100 - f * 100) + '%'; sec.textContent = Math.ceil(S.c.time * (1 - f)) + ' s'; if (f > .7) { if (!bar.classList.contains('low')) bar.classList.add('low'); if (Math.floor(f * T / 1000) !== S.tick) { S.tick = Math.floor(f * T / 1000); tone(900, .05, 'square', .05) } } }, 100)
        }
        function answer(b) {
            if (S.lock) return; S.lock = true; clearInterval(S.iv); const q = S.qs[S.n], f = (performance.now() - S.t0) / (S.c.time * 1000), fb = document.getElementById('fb');
            app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === q.a) x.classList.add('right') });
            if (b && b.dataset.v === q.a) {
                const st = 5 - Math.min(4, Math.floor(f * 5)); S.ok++; S.stars += st; b.classList.add('jump'); snd.ok(); setTimeout(snd.star, 250); confetti(st * 5);
                fb.innerHTML = `<div class="st">${'⭐'.repeat(st)}</div>${['', 'Yaxshi!', 'Zo‘r!', 'Barakalla!', 'Ajoyib!', 'Ofarin! Juda tez!'][st]}`
            }
            else { if (b) { b.classList.add('wrong'); snd.bad(); fb.innerHTML = '😕 Xato! To‘g‘ri javob yashil rangda' } else { snd.time(); fb.innerHTML = '⏰ Vaqt tugadi!' } }
            document.querySelector('.chip:last-child').textContent = '⭐ ' + S.stars;
            setTimeout(() => { S.n++; S.n < 10 ? ask() : done() }, 1500)
        }
        function done() {
            const best = load('best_' + S.g.id, 0), nb = S.stars > best; if (nb) save('best_' + S.g.id, S.stars); snd.win(); confetti(40);
            const r = S.stars / 50, m = r >= .8 ? ['🏆', 'Ofarin! Sen daho ekansan!'] : r >= .5 ? ['🎉', 'Barakalla! Juda yaxshi!'] : r >= .2 ? ['😊', 'Yaxshi! Yana bir bor urinib ko‘r!'] : ['💪', 'Yana urinib ko‘r, albatta uddalaysan!'];
            app.innerHTML = `<div class="card res"><div class="em">${m[0]}</div><h2>${m[1]}</h2><div class="big-st">⭐ ${S.stars} / 50</div><p>To‘g‘ri javoblar: <b>${S.ok}</b> / 10</p><p>${nb ? '🎊 Yangi rekord!' : '🏆 Rekord: ' + best + ' ⭐'}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="snd.click();play('${S.k}',${G[S.k].games.indexOf(S.g)})">🔁 Yana o‘ynash</button><button class="btn" style="background:#ff9f43" onclick="snd.click();list('${S.k}')">📋 O‘yinlar</button></div></div>`
        }
        function confetti(n) { const e = ['⭐', '🎉', '🎊', '✨', '🌟']; for (let i = 0; i < n; i++) { const s = document.createElement('span'); s.className = 'fall'; s.textContent = pick(e); s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 2800) } }
        home();
    </script>
</body>
